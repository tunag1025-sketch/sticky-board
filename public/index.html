<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>메모 남기기</title>
<link rel="stylesheet" href="/common.css">
<style>
  main { max-width:480px; margin:0 auto; padding:calc(var(--space-6) + env(safe-area-inset-top)) var(--space-4) calc(120px + env(safe-area-inset-bottom)); }
  .eyebrow { margin:0 0 var(--space-2); font-size:var(--text-xs); font-weight:700; letter-spacing:.08em; color:var(--color-text-muted); }
  h1 { margin:0; font-size:var(--text-2xl); font-weight:800; letter-spacing:-.02em; line-height:1.3; }
  .lead { margin:var(--space-2) 0 var(--space-6); font-size:var(--text-base); color:var(--color-text-muted); line-height:1.5; }

  .field-label { display:block; margin-bottom:var(--space-3); font-size:var(--text-sm); font-weight:700; }

  /* 미리보기 겸 입력 메모지 */
  .note { position:relative; background:var(--note, #F3E9D2); border-radius:2px; padding:var(--space-8) var(--space-5) var(--space-4);
          box-shadow:var(--shadow-note); transition:background-color var(--dur-2) var(--ease-out); }
  .note .pin { position:absolute; left:50%; top:var(--space-3); width:16px; height:16px; margin-left:-8px; border-radius:50%;
               background:radial-gradient(circle at 35% 30%, #fff 0 14%, #E63946 46%, #9d1d27 100%); box-shadow:0 2px 3px rgba(0,0,0,.3); }
  textarea { display:block; width:100%; min-height:168px; border:0; padding:0; background:transparent; resize:none; outline:none;
             font:600 var(--text-xl)/1.45 var(--font); letter-spacing:-.01em; color:var(--color-on-note); word-break:keep-all; overflow-wrap:anywhere; }
  textarea::placeholder { color:rgba(17,17,17,.42); }
  .note:focus-within { box-shadow:var(--shadow-note), 0 0 0 3px var(--color-focus); }
  .meta { display:flex; justify-content:space-between; gap:var(--space-3); margin-top:var(--space-2); font-size:var(--text-sm); color:var(--color-text-muted); }
  .count { font-variant-numeric:tabular-nums; }
  .count.over { color:var(--color-danger); font-weight:700; }

  fieldset { margin:var(--space-8) 0 0; padding:0; border:0; }
  legend { display:flex; justify-content:space-between; width:100%; padding:0; margin-bottom:var(--space-3); font-size:var(--text-sm); font-weight:700; }
  legend span { font-weight:500; color:var(--color-text-muted); }
  .swatches { display:grid; grid-template-columns:repeat(6, 1fr); gap:var(--space-3); }
  .swatch { position:relative; display:block; aspect-ratio:1; min-width:44px; min-height:44px; cursor:pointer; touch-action:manipulation; }
  .swatch input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .swatch i { position:absolute; inset:0; border-radius:var(--radius-sm); background:var(--c); box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
              transition:transform var(--dur-1) var(--ease-out); }
  .swatch svg { position:absolute; inset:0; margin:auto; width:22px; height:22px; color:var(--color-on-note); opacity:0; transition:opacity var(--dur-1); }
  .swatch input:checked ~ i { box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 0 0 2px #fff, 0 0 0 4px var(--color-text); }
  .swatch input:checked ~ svg { opacity:1; }
  .swatch input:focus-visible ~ i { outline:3px solid var(--color-focus); outline-offset:4px; }
  .swatch:active i { transform:scale(.94); }

  .status { display:flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:24px; margin-top:var(--space-5);
            font-size:var(--text-base); font-weight:600; text-align:center; }
  .status svg { width:20px; height:20px; flex:none; }
  .status.err { color:var(--color-danger); } .status.ok { color:var(--color-success); }

  .notice { display:none; margin-top:var(--space-5); padding:var(--space-4); border:1px solid var(--color-border); border-radius:var(--radius-md);
            font-size:var(--text-base); text-align:center; color:var(--color-text); }
  body.is-closed .notice { display:block; }

  /* 하단 고정 버튼 (주요 동작 1개) */
  .actionbar { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--color-bg);
               padding:var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom)); border-top:1px solid var(--color-border); }
  .actionbar .btn { max-width:448px; margin:0 auto; }

  .note.sent { animation:sent var(--dur-3) var(--ease-in) forwards; }
  @keyframes sent { to { transform:translateY(-40vh) scale(.85); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .note.sent { animation:none; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">LIVE MEMO</p>
  <h1>메모를 남겨주세요</h1>
  <p class="lead">작성한 메모는 무대 화면에 바로 붙어요.</p>

  <label class="field-label" for="text">메모 내용</label>
  <div class="note" id="note">
    <span class="pin" aria-hidden="true"></span>
    <textarea id="text" placeholder="연사에게 하고 싶은 말, 질문, 소감 무엇이든 좋아요" maxlength="400" aria-describedby="hint count"></textarea>
  </div>
  <div class="meta">
    <span id="hint">무대 화면에 이름 없이 표시돼요</span>
    <span class="count" id="count" aria-live="polite">0 / 100</span>
  </div>

  <fieldset>
    <legend>메모지 색상 <span id="colorName"></span></legend>
    <div class="swatches" id="swatches" role="radiogroup"></div>
  </fieldset>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="notice" role="alert">지금은 메모 접수가 마감되었어요. 진행자 안내를 기다려주세요.</div>
</main>

<div class="actionbar">
  <button class="btn btn-primary btn-lg btn-block" id="send" type="button" disabled>무대 화면에 붙이기</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const COLOR_NAMES = ['크림','핑크','라벤더','레드','라이트 핑크','로즈','그린','살몬','민트','오렌지','머스터드','스카이'];
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>';

  const socket = io({ transports: ['websocket', 'polling'] });
  const $ = (id) => document.getElementById(id);
  const text = $('text'), send = $('send'), status = $('status'), note = $('note');
  let maxLen = 100, open = true, color = null, busy = false;

  const len = () => [...text.value.trim()].length;
  function refresh() {
    const n = [...text.value].length;
    $('count').textContent = `${n} / ${maxLen}`;
    $('count').classList.toggle('over', len() > maxLen);
    send.disabled = busy || !open || len() === 0 || len() > maxLen || !socket.connected;
    send.textContent = busy ? '보내는 중…' : '무대 화면에 붙이기';
    send.setAttribute('aria-busy', busy);
  }
  function say(kind, msg) {
    status.className = 'status ' + (kind || '');
    status.innerHTML = msg ? (kind === 'ok' ? ICON_CHECK : kind === 'err' ? ICON_ALERT : '') + '<span></span>' : '';
    if (msg) status.querySelector('span').textContent = msg;
  }
  function pick(i, colors) {
    color = colors[i];
    note.style.setProperty('--note', color);
    $('colorName').textContent = COLOR_NAMES[i] || '';
  }

  socket.on('settings', (s) => {
    maxLen = s.maxLen; open = s.open;
    document.body.classList.toggle('is-closed', !open);
    const box = $('swatches');
    if (!box.children.length) {
      const start = Math.floor(Math.random() * s.colors.length);
      s.colors.forEach((c, i) => {
        const l = document.createElement('label');
        l.className = 'swatch'; l.style.setProperty('--c', c);
        l.innerHTML = `<input type="radio" name="color" value="${c}" aria-label="${COLOR_NAMES[i] || '색상 ' + (i + 1)}"${i === start ? ' checked' : ''}><i></i>${ICON_CHECK}`;
        l.querySelector('input').addEventListener('change', () => pick(i, s.colors));
        box.appendChild(l);
      });
      pick(start, s.colors);
    }
    refresh();
  });
  socket.on('connect', () => { if (status.dataset.offline) { say(); delete status.dataset.offline; } refresh(); });
  socket.on('disconnect', () => { status.dataset.offline = 1; say('err', '연결이 끊겼어요. 자동으로 다시 연결하는 중이에요.'); refresh(); });
  text.addEventListener('input', () => { if (!status.dataset.offline) say(); refresh(); });

  send.addEventListener('click', () => {
    if (send.disabled) return;
    busy = true; refresh();
    socket.timeout(8000).emit('note:create', { text: text.value, color }, (err, res) => {
      busy = false;
      if (err) { say('err', '전송이 늦어지고 있어요. 버튼을 한 번 더 눌러주세요.'); return refresh(); }
      if (!res.ok) { say('err', res.error); return refresh(); }
      navigator.vibrate?.(30);
      note.classList.add('sent');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(() => { note.classList.remove('sent'); text.value = ''; refresh(); }, reduce ? 0 : 420);
      say('ok', '무대 화면에 붙였어요. 또 남겨도 좋아요!');
      refresh();
    });
  });
</script>
</body>
</html>
